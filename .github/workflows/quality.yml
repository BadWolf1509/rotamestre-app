name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: TypeScript & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security Audit (produção, informativo)
        # Roda scripts/audit-producao.js em vez do `npm audit` cru.
        #
        # O comando cru ficava vermelho para SEMPRE por causa de advisory sem
        # correção upstream — e um check cronicamente vermelho deixa de sinalizar
        # qualquer coisa nova. Foi exatamente o que aconteceu: em 25/08/2026 este
        # step estava falhando com 4 high do `image-size` e ninguém percebeu,
        # porque o `continue-on-error` engolia. O comentário anterior aqui ainda
        # afirmava "atualmente PASSA (0 high/critical de produção)", o que havia
        # deixado de ser verdade.
        #
        # O script mantém allowlist POR ID DE ADVISORY — nunca por pacote, para
        # que um advisory novo no mesmo pacote continue quebrando — com motivo e
        # data de revisão em cada entrada, e escreve o resultado no summary do
        # job (visível na página de checks mesmo com o job verde).
        #
        # Segue informativo por ora, para que um advisory publicado de madrugada
        # não bloqueie PR não relacionado. Com os insolúveis agora explicitamente
        # aceitos, tornar bloqueante é só remover o `continue-on-error` — e passou
        # a ser uma opção defensável, o que antes não era.
        run: node scripts/audit-producao.js
        continue-on-error: true

      - name: Expo SDK dependency check
        # `expo install --check` compara o que está INSTALADO em node_modules
        # (isto é, o que o package-lock resolve) com as versões que o SDK fixa em
        # bundledNativeModules. Não olha os ranges declarados no package.json.
        #
        # Existe porque essa deriva é invisível de outra forma: `expo`, `expo-*`
        # e `@expo/*` estão fora do Dependabot de propósito — devem subir em
        # lockstep com o SDK via `expo install`, nunca isoladamente (ver o bloco
        # ignore em .github/dependabot.yml). Ninguém os atualiza automaticamente
        # e nada avisava: em 24/08/2026 a defasagem tinha chegado a 7 patches, e
        # o bump do expo-router passou a exigir react-native-screens ^4.26.0 —
        # com a raiz em 4.25.2 o npm instalava uma segunda cópia aninhada do
        # módulo nativo (PRs #421 e #423).
        #
        # Informativo (continue-on-error), no mesmo espírito do audit acima: um
        # patch recém-publicado pela Expo deixaria todo PR vermelho até alguém
        # rodar `expo install --fix`, bloqueando trabalho não relacionado. O
        # resultado vai para o summary do job, então fica visível mesmo quando
        # o job passa. Para torná-lo bloqueante, basta remover o
        # `continue-on-error` abaixo.
        run: |
          saida=$(npx expo install --check 2>&1) && codigo=0 || codigo=$?
          echo "$saida"
          if [ "$codigo" -ne 0 ]; then
            {
              echo "### :warning: Dependências do Expo fora do que o SDK fixa"
              echo
              echo '```'
              echo "$saida" | sed -n '/should be updated/,$p'
              echo '```'
              echo
              echo 'Corrija com `npx expo install --fix` em um PR próprio.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### :white_check_mark: Dependências do Expo alinhadas com o SDK' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$codigo"
        continue-on-error: true

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    # Only run on PRs to show size diff
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check bundle size
        run: npm run size
