name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: TypeScript & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Expo SDK dependency check
        # `expo install --check` compara o que está INSTALADO em node_modules
        # (isto é, o que o package-lock resolve) com as versões que o SDK fixa em
        # bundledNativeModules. Não olha os ranges declarados no package.json.
        #
        # Existe porque essa deriva é invisível de outra forma: `expo`, `expo-*`
        # e `@expo/*` estão fora do Dependabot de propósito — devem subir em
        # lockstep com o SDK via `expo install`, nunca isoladamente (ver o bloco
        # ignore em .github/dependabot.yml). Ninguém os atualiza automaticamente
        # e nada avisava: em 24/08/2026 a defasagem tinha chegado a 7 patches, e
        # o bump do expo-router passou a exigir react-native-screens ^4.26.0 —
        # com a raiz em 4.25.2 o npm instalava uma segunda cópia aninhada do
        # módulo nativo (PRs #421 e #423).
        #
        # Informativo (continue-on-error), no mesmo espírito do audit acima: um
        # patch recém-publicado pela Expo deixaria todo PR vermelho até alguém
        # rodar `expo install --fix`, bloqueando trabalho não relacionado. O
        # resultado vai para o summary do job, então fica visível mesmo quando
        # o job passa. Para torná-lo bloqueante, basta remover o
        # `continue-on-error` abaixo.
        run: |
          saida=$(npx expo install --check 2>&1) && codigo=0 || codigo=$?
          echo "$saida"
          if [ "$codigo" -ne 0 ]; then
            {
              echo "### :warning: Dependências do Expo fora do que o SDK fixa"
              echo
              echo '```'
              echo "$saida" | sed -n '/should be updated/,$p'
              echo '```'
              echo
              echo 'Corrija com `npx expo install --fix` em um PR próprio.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### :white_check_mark: Dependências do Expo alinhadas com o SDK' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$codigo"
        continue-on-error: true

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

      - name: Security Audit (produção)
        # Roda scripts/audit-producao.js em vez do `npm audit` cru.
        #
        # O comando cru ficava vermelho para SEMPRE por causa de advisory sem
        # correção upstream — e um check cronicamente vermelho deixa de sinalizar
        # qualquer coisa nova. Foi exatamente o que aconteceu: em 25/08/2026 este
        # step estava falhando com 4 high do `image-size` e ninguém percebeu,
        # porque um `continue-on-error` engolia.
        #
        # O script mantém allowlist POR ID DE ADVISORY — nunca por pacote, para
        # que um advisory novo no mesmo pacote continue quebrando — com motivo e
        # data de revisão em cada entrada, e escreve o resultado no summary do job.
        #
        # ORDEM: este step vem POR ÚLTIMO de propósito. Sendo bloqueante, uma
        # falha aqui faz o Actions PULAR todo o resto do job — quando estava antes
        # do typecheck e do lint, um advisory novo escondia o resultado deles, e
        # quem abrisse o PR via só o audit vermelho. Verificado em CI real em
        # 25/08/2026: com um advisory fora da allowlist, os 3 steps seguintes
        # apareceram como "skipped".
        #
        # BLOQUEANTE: este job ("TypeScript & Linting") é um dos dois checks
        # exigidos pela proteção da main, então uma falha aqui trava o merge. É
        # deliberado — foi a invisibilidade que deixou 4 high passarem despercebidos.
        #
        # Quando quebrar, há dois caminhos, nessa ordem:
        #   1. Existe correção upstream? Suba a dependência.
        #   2. Não existe e o risco é aceitável? Acrescente o ID do advisory a
        #      ACEITOS em scripts/audit-producao.js, com motivo e data de revisão.
        # O que não vale é reverter para `continue-on-error` — foi assim que a
        # rede de segurança parou de servir para alguma coisa.
        run: node scripts/audit-producao.js

      - name: Dependência não declarada
        # `knip --include unlisted,binaries`: falha quando um arquivo importa
        # pacote que NÃO está no package.json.
        #
        # POR QUE ISTO É BLOQUEANTE, sendo que o resto da varredura de código
        # morto não é. Import não declarado resolve HOJE, por acaso — porque
        # alguma outra dependência o arrasta para o node_modules raiz. Não há
        # sintoma: type-check passa, lint passa, teste passa, build passa. Ele
        # quebra no dia em que o pacote que o arrastava muda, e aí quebra em
        # produção, longe do commit que o introduziu.
        #
        # Em 08/09/2026 o `expo-file-system` estava assim: nunca declarado,
        # resolvido só por ser transitivo de expo@56, com CINCO arquivos de
        # produção dependendo dele — storage.ts (upload de foto), offline.ts
        # (sync) e os três routeExport*. Nada no CI apontava.
        #
        # Esta categoria não tem falso positivo: ou o import resolve pelo
        # package.json, ou não resolve. É o que a separa das outras do knip —
        # "arquivo não usado" tem falso positivo (variante de plataforma), e
        # por isso `npm run scan:morto` fica FORA do CI de propósito: falso
        # positivo em check obrigatório ensina o time a ignorar o check.
        #
        # ORDEM: vem por último pelo mesmo motivo do audit acima — step
        # bloqueante que falha faz o Actions pular todos os seguintes.
        #
        # LIMITE MEDIDO, não suposto. A guarda só enxerga arquivo ALCANÇÁVEL a
        # partir de um `entry`. Import não declarado dentro de arquivo órfão
        # passa batido — o knip nem analisa o conteúdo de quem já considera
        # morto. Descoberto ao verificar esta guarda em vermelho: o primeiro
        # plantio foi num arquivo novo que ninguém importava, e o check
        # continuou VERDE. O segundo, dentro de src/lib/logger.ts, quebrou como
        # devia. Quem cair aqui procurando por que um import escapou: confira
        # antes se o arquivo aparece em `npm run scan:morto:arquivos`.
        #
        # Quando quebrar: declare o pacote (`npx expo install` para os do SDK,
        # `npm i -D` para ferramenta de teste). Só use `ignoreDependencies` no
        # knip.jsonc se o consumo NÃO for import — config ou CLI — e deixe o
        # arquivo consumidor escrito na linha, como as entradas de lá.
        run: npm run scan:nao-declarado

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    # Only run on PRs to show size diff
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check bundle size
        run: npm run size
