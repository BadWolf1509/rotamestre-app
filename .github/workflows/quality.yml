name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: TypeScript & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: rotamestre-app/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            rotamestre-app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('rotamestre-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: rotamestre-app
        run: npm ci

      - name: TypeScript type check
        working-directory: rotamestre-app
        run: npm run type-check

      - name: Lint check
        working-directory: rotamestre-app
        run: npm run lint || true
