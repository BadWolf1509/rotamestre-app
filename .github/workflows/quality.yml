name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: TypeScript & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security Audit (produção, informativo)
        # Foca em deps de produção (--omit=dev) no nível high+. Atualmente PASSA
        # (0 high/critical de produção após #292+ — shell-quote/form-data/xlsx
        # corrigidas). O único advisory transitivo restante é `uuid` (moderate,
        # via xcode → @expo/config-plugins, tooling de build que não vai pro
        # bundle; fix exigiria downgrade breaking do Expo). Mantido informativo
        # (continue-on-error) como rede de segurança se um high/critical de
        # produção reaparecer.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    # Only run on PRs to show size diff
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check bundle size
        run: npm run size
