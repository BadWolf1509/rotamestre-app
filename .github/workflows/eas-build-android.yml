# Build Android com `eas build --local` num runner Linux do GitHub.
#
# Por que existe: o plano gratuito do EAS tem cota mensal de builds Android, e
# em 20/10/2026 ela acabou antes da release 1.13.0 (os builds preview e
# development de ajuste gastam a mesma cota). `--local` compila aqui, no
# runner, e usa do EAS só as credenciais de assinatura e as variáveis de
# ambiente — não consome a cota. Não roda no Windows, por isso não é local.
#
# O envio para a Play NÃO acontece aqui: a chave da conta de serviço fica só na
# máquina do gestor. Baixe o artefato e rode
#   npx --yes eas-cli@latest submit --platform android --profile internal --path <arquivo.aab>
#
# Requer o secret EXPO_TOKEN (token de acesso da conta Expo, criado pelo gestor).

name: EAS Build Android (local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil do eas.json'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          # Dev client (APK debug): para iterar JS com Metro sem gastar a cota do EAS.
          - development

concurrency:
  group: eas-build-android-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Conferir o secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN ausente::Cadastre o secret EXPO_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # O build nativo do React Native passa de 14 GB com Gradle e NDK; o runner
      # vem com ~14 GB livres. Remove SDKs que este build não usa.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # O prebuild gera android/gradle.properties com -Xmx2048m e
      # MaxMetaspaceSize=512m. No 1º build (20/10/2026) o daemon esgotou o
      # Metaspace no lint de release, a tarefa falhou e o processo ficou parado
      # até o timeout. O gradle.properties do usuário tem precedência sobre o do
      # projeto; o runner de repositório público tem 16 GB.
      - name: Memória do Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.workers.max=4
          EOF
          cat ~/.gradle/gradle.properties

      - name: Instalar dependências
        run: npm ci

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          CODIGO=$(node -p "require('./package.json').androidVersionCode")
          if [ "${{ inputs.profile }}" = "production" ]; then EXT=aab; else EXT=apk; fi
          SAIDA="rotamestre-${VERSAO}-${CODIGO}-${{ inputs.profile }}.${EXT}"
          echo "SAIDA=$SAIDA" >> "$GITHUB_ENV"
          # Versão exata (não @latest): o EXPO_TOKEN está no ambiente. Para
          # atualizar: npm view eas-cli version, e troque aqui.
          npx --yes eas-cli@25.3.0 build --local --platform android \
            --profile "${{ inputs.profile }}" --non-interactive --output "$SAIDA"
          ls -la "$SAIDA"
          sha256sum "$SAIDA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SAIDA }}
          path: ${{ env.SAIDA }}
          # Repositório público: artefato fica baixável por qualquer conta
          # logada. O .aab assinado vai para a loja de todo jeito, mas não há
          # por que deixá-lo exposto além do tempo de baixar e enviar.
          retention-days: 3
          if-no-files-found: error
