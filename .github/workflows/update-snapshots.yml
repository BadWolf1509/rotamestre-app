name: Update Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Update Snapshots (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # Use PAT to bypass branch protection rules
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Update snapshots
        run: npm run test:visual:update
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # As duas pastas existem no repo; sem `|| true`, um pathspec que
          # deixe de casar (pasta renomeada) falha o step em vez de sumir.
          git add e2e/design-system.e2e.ts-snapshots/ e2e/visual-critical.e2e.ts-snapshots/
          git status
          # "Nada a commitar" é o único caso que sai com 0 sem push. Qualquer
          # falha de commit ou de push (proteção de branch, PAT sem permissão,
          # corrida com outro push) derruba o job, em vez de virar um eco.
          if git diff --staged --quiet; then
            echo "Nenhum snapshot mudou; nada a commitar."
            exit 0
          fi
          git commit -m "chore: update visual snapshots (linux) [skip ci]"
          git push
