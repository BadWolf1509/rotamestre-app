name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run visual regression tests'
        required: false
        default: false
        type: boolean
      update_snapshots:
        description: 'Update visual regression snapshots'
        required: false
        default: false
        type: boolean

# GITHUB_TOKEN só leitura: nenhum job aqui escreve no repositório.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior: sem isto, cada push
# empilhava um e2e completo, e cada um escreve na rota demo de produção
# (`garantirRotaDoMapa`). Só PR cancela; push na main e dispatch seguem até o
# fim, para a main nunca ficar sem veredito.
#
# Cancelar no meio do e2e é seguro para o banco: o fixture é idempotente e
# compare-and-set, e relê o estado a cada execução (ver
# e2e/fixtures/garantir-rota-do-mapa.ts). O pior caso é a rota demo ficar
# `pendente` entre a cópia e o início, que a execução seguinte conserta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  design-system-audit:
    name: Design System Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build tokens
        run: npm run build:tokens

      - name: Generate hex report
        run: npm run report:hex

      - name: Verify hex allowlist
        run: npm run verify:design-system

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Design system outputs are out of date."
            git status --porcelain
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Aplicar patches (patch-package)
        # `--ignore-scripts` pula o postinstall, que aplica patches/. Sem isto o
        # Jest e o build rodam a lib sem o patch (a guarda
        # draggable-flatlist-sem-interaction-manager falha) e o artefato do CI
        # difere do da Vercel e do EAS, que rodam o postinstall.
        run: npx patch-package --error-on-fail

      - name: Run tests
        # Fuso do projeto, não o UTC do runner: os bugs de fuso (coluna `date`
        # um dia atrás, dia do calendário via toISOString) só aparecem em fuso
        # negativo. Guarda: src/lib/__tests__/fuso-do-ci.test.ts.
        env:
          TZ: America/Sao_Paulo
        run: npm test -- --coverage --maxWorkers=2

      - name: Resumo do jest (falhas e testes mais lentos)
        # 30(m). Roda mesmo com o jest vermelho. Não há retentativa configurada
        # (`retryTimes`), então "passou só após retentar" não existe; o
        # resumo lista os que falharam e os 10 mais lentos, lidos do junit.xml
        # que o jest-junit já grava. Informativo: nunca falha o job.
        if: always()
        run: node scripts/lib/resumo-jest-junit.js coverage/junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: coverage
          retention-days: 30

  e2e-auth:
    name: E2E autenticado
    runs-on: ubuntu-latest
    # Mapa + suíte e2e completa. Build web + browsers + e2e: 3 min medidos de
    # teste, folga larga mas finita.
    timeout-minutes: 30
    # Job PRÓPRIO, com `if:` no nível do job, para que o pulo apareça na lista de
    # checks do PR como "Skipped" (cinza) em vez de um ✓ verde enganoso.
    #
    # Quem nunca recebe secrets: Dependabot (guarda os próprios, em store
    # separado e vazio) e PR de fork. Nenhuma das duas condições depende de
    # secret, então cabem no `if:` do job: `github.actor` e
    # `github.event.pull_request.head.repo.full_name` existem ali (`secrets`,
    # não). `github.actor` fica igual num re-run (quem o dispara é
    # `github.triggering_actor`), então re-rodar um PR do Dependabot continua
    # pulando, como deve: os secrets seguem sendo os do bot.
    #
    # PR de humano, push na main e dispatch RODAM, e sem secret o step falha com
    # ::error::. O caminho `update_snapshots=true` também pula este job: quem
    # trabalha nele é o job `visual-regression`, com as mesmas envs.
    #
    # Alternativas comparadas (24/10/2026):
    #   1. `if:` nos steps, dentro de `visual-regression`: o job inteiro sairia
    #      verde com steps cinza, e a lista de checks do PR não mostra step. É o
    #      problema que esta troca resolve (era a solução anterior, com `exit 0`
    #      e `::warning::`, que só aparece a quem abre o run).
    #   2. `if:` no job `visual-regression` inteiro: o bot perderia também a
    #      regressão visual pública, que não precisa de secret. Descartada.
    #   3. Job próprio (esta). Custo: build web e browsers repetidos, ~4 min.
    #
    # Check obrigatório da main: `Visual Regression (22.x)` NÃO muda de nome. Ele
    # continua obrigatório e passa a depender deste job (`needs`): falha se
    # este falhar, e conta como satisfeito se for pulado. Assim o e2e não sai do
    # gate da main e não há check novo a cadastrar em Settings > Branches. Um
    # job pulado satisfaz check exigido, e é essa a semântica certa para
    # bot/fork; para humano o job roda e falha sem secret.
    if: ${{ github.event.inputs.update_snapshots != 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Aplicar patches (patch-package)
        # `--ignore-scripts` pula o postinstall, que aplica patches/. Sem isto o
        # Jest e o build rodam a lib sem o patch (a guarda
        # draggable-flatlist-sem-interaction-manager falha) e o artefato do CI
        # difere do da Vercel e do EAS, que rodam o postinstall.
        run: npx patch-package --error-on-fail

      - name: Preparar Playwright (worker do MapLibre, navegadores e libs)
        uses: ./.github/actions/setup-playwright-web

      - name: Construir o bundle web
        # OBRIGATORIO desde 07/09/2026: o `webServer` do playwright.config.ts
        # passou a servir `dist/` em vez de rodar `expo start --web`. Sem este
        # step o servidor sobe sem bundle e TODOS os testes falham com 404.
        #
        # O ganho medido: a suite inteira caiu de 17,5 min (dev server, 1
        # worker) para a casa dos minutos, e as falhas por contencao sumiram —
        # elas eram disputa por compilacao, nao defeito. De quebra, o teste
        # passa a exercitar o MESMO artefato que vai para a Vercel.
        #
        # --ignore-scripts pula só o gancho `prebuild:web` (tsc --noEmit): o
        # tipo já é checado pelo job `TypeScript & Linting` (quality.yml), e o
        # gancho fica no package.json porque Vercel e EAS passam por ele. Num
        # `npm run`, a flag NÃO impede o corpo do script, só os pre/post. Foi
        # preferida a chamar o corpo direto (duplicaria a cadeia de 5 comandos
        # do package.json nos três jobs que buildam a web).
        run: npm run build:web --ignore-scripts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Testes de mapa (autenticados)
        # Os testes de mapa vivem no describe `@auth`, que o job
        # `visual-regression` NÃO roda: `test:visual:public` filtra por
        # `@visual.*@public`. Sem este step o mapa fica sem cobertura nenhuma em
        # CI — foi assim que duas baselines congelando o mapa travado em
        # "Carregando mapa..." sobreviveram desde 09/01/2026 sem ninguém notar.
        #
        # Depende de conta de teste. Aqui só chega quem deveria ter os secrets
        # (o `if:` do job pula Dependabot e PR de fork), então secret ausente é
        # secret apagado ou renomeado: o step FALHA, sem exceção. O pulo de
        # bot/fork é o job aparecendo "Skipped" na lista de checks.
        # `gh workflow run test.yml --ref <branch>` roda com secrets.
        run: |
          if [ -z "$E2E_MOTORISTA_EMAIL" ] || [ -z "$E2E_MOTORISTA_PASSWORD" ] || [ -z "$E2E_GESTOR_EMAIL" ] || [ -z "$E2E_GESTOR_PASSWORD" ]; then
            echo '### :x: Testes de mapa NÃO executados (secrets E2E ausentes)' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Mapa sem cobertura::Secrets E2E_* ausentes. Configure E2E_MOTORISTA_EMAIL, E2E_MOTORISTA_PASSWORD, E2E_GESTOR_EMAIL e E2E_GESTOR_PASSWORD em Settings > Secrets."
            exit 1
          fi
          npx playwright test e2e/visual-critical.e2e.ts --project=chromium -g "mapa"
          echo '### :white_check_mark: Testes de mapa executados' >> "$GITHUB_STEP_SUMMARY"
        env:
          VISUAL_REGRESSION: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_MOTORISTA_EMAIL: ${{ secrets.E2E_MOTORISTA_EMAIL }}
          E2E_MOTORISTA_PASSWORD: ${{ secrets.E2E_MOTORISTA_PASSWORD }}
          E2E_GESTOR_EMAIL: ${{ secrets.E2E_GESTOR_EMAIL }}
          E2E_GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}

      - name: Suite e2e completa
        # LIGADA EM 07/09/2026. Antes o CI rodava UM filtro dentro de um
        # arquivo (`visual-critical -g "mapa"`) e os outros ~105 testes nunca
        # executavam. O custo era o argumento: 17,5 min em serie contra os
        # ~5 min de CI da epoca.
        #
        # Servindo `dist/` em vez do dev server, a suite inteira leva 3,0 min
        # com zero falhas — medido em 07/09. O argumento de custo caiu junto
        # com o dev server.
        #
        # POR QUE ISTO IMPORTA: no mesmo dia, uma regressao mergeada no #490
        # (um aviso cujo texto contem "mapa", colidindo com o seletor da aba)
        # atravessou CI verde, revisao de task, revisao final de branch,
        # re-revisao de onda de correcao e validacao em aparelho. So o e2e
        # pegou — e ninguem soube, porque ele nao rodava aqui.
        #
        # Sem os secrets E2E_*: falha. Bot/fork nem chegam aqui (o `if:` do job
        # os pula; ver o comentário do job `e2e-auth`).
        run: |
          if [ -z "$E2E_MOTORISTA_EMAIL" ] || [ -z "$E2E_MOTORISTA_PASSWORD" ] || [ -z "$E2E_GESTOR_EMAIL" ] || [ -z "$E2E_GESTOR_PASSWORD" ]; then
            echo '### :x: Suite e2e NÃO executada (secrets E2E ausentes)' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=e2e nao executada::Secrets E2E_* ausentes. Configure-os em Settings > Secrets."
            exit 1
          fi
          npx playwright test --project=chromium
          echo '### :white_check_mark: Suite e2e completa executada' >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_MOTORISTA_EMAIL: ${{ secrets.E2E_MOTORISTA_EMAIL }}
          E2E_MOTORISTA_PASSWORD: ${{ secrets.E2E_MOTORISTA_PASSWORD }}
          E2E_GESTOR_EMAIL: ${{ secrets.E2E_GESTOR_EMAIL }}
          E2E_GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}

      - name: Upload e2e screenshots
        # Evidência da falha (antes não havia nenhuma: só o log de texto). SÓ
        # PNG, pelo mesmo motivo do upload do job visual-regression: trace,
        # relatório HTML e error-context podem carregar a senha das contas E2E
        # e tokens, e o artefato de um repositório público é baixável por
        # qualquer conta logada.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    # Build web + browsers + e2e (3 min medidos) + visual: folga larga, mas finita.
    timeout-minutes: 30
    # Depende do e2e autenticado para que ESTE check (obrigatório na main, nome
    # inalterado) continue sendo o portão dele: `!cancelled()` faz o job rodar
    # mesmo com o e2e pulado (bot/fork, update_snapshots) ou falho; o último
    # step converte falha do e2e em falha deste job. Roda depois do e2e, não em
    # paralelo: é o preço de não cadastrar um check novo na proteção da main.
    needs: e2e-auth
    if: ${{ !cancelled() }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Aplicar patches (patch-package)
        # `--ignore-scripts` pula o postinstall, que aplica patches/. Sem isto o
        # Jest e o build rodam a lib sem o patch (a guarda
        # draggable-flatlist-sem-interaction-manager falha) e o artefato do CI
        # difere do da Vercel e do EAS, que rodam o postinstall.
        run: npx patch-package --error-on-fail

      - name: Preparar Playwright (worker do MapLibre, navegadores e libs)
        uses: ./.github/actions/setup-playwright-web

      - name: Construir o bundle web
        # OBRIGATORIO desde 07/09/2026: o `webServer` do playwright.config.ts
        # passou a servir `dist/` em vez de rodar `expo start --web`. Sem este
        # step o servidor sobe sem bundle e TODOS os testes falham com 404.
        #
        # O ganho medido: a suite inteira caiu de 17,5 min (dev server, 1
        # worker) para a casa dos minutos, e as falhas por contencao sumiram —
        # elas eram disputa por compilacao, nao defeito. De quebra, o teste
        # passa a exercitar o MESMO artefato que vai para a Vercel.
        #
        # --ignore-scripts pula só o gancho `prebuild:web` (tsc --noEmit): o
        # tipo já é checado pelo job `TypeScript & Linting` (quality.yml), e o
        # gancho fica no package.json porque Vercel e EAS passam por ele. Num
        # `npm run`, a flag NÃO impede o corpo do script, só os pre/post. Foi
        # preferida a chamar o corpo direto (duplicaria a cadeia de 5 comandos
        # do package.json nos três jobs que buildam a web).
        run: npm run build:web --ignore-scripts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run visual regression tests (public only - no auth required)
        # OS TRÊS STEPS DE TESTE ABAIXO NÃO SÃO REDUNDANTES, por mais que
        # pareçam. Já tentei "otimizar" isto em 21/09/2026 e teria apagado a
        # única execução da regressão visual — em silêncio, com o job verde.
        #
        # O que separa os três é a env `VISUAL_REGRESSION`, não o filtro:
        # `e2e/design-system.e2e.ts` e `e2e/visual-critical.e2e.ts` abrem com
        # `test.skip(!process.env.VISUAL_REGRESSION, ...)`.
        #
        #   este step      VISUAL_REGRESSION=1 (o runner define) -> 26 passed
        #   Suite completa  SEM a env                             -> 19 SKIPPED
        #
        # Ou seja: a suíte completa roda os 96 testes funcionais e **pula** os
        # visuais. Quem olhar só o `--grep` conclui que a suíte cobre este step.
        # Não cobre. Os números acima saíram do run 35659691639.
        #
        # A única sobreposição real é o step de mapa (4 testes, 23 s), que roda
        # duas vezes porque o teste do mapa fica FORA do gate de propósito
        # (`visual-critical.e2e.ts:220`). Fica assim: 23 s é o preço do sinal
        # explícito "Testes de mapa executados" no log, e esse sinal já foi a
        # diferença entre ver e não ver um mapa quebrado.
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npm run test:visual:public
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Update visual regression snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        # Sem `|| true`: o Playwright sai com 0 quando só os snapshots mudam
        # (é o que --update-snapshots faz); exit != 0 aqui é teste quebrado de
        # verdade e não deve virar verde. O upload abaixo tem `always()`, então
        # os PNGs gerados são guardados mesmo se este step falhar.
        # Só os testes @visual (run-visual-tests.cjs --update --all): o
        # `npx playwright test` cru rodava a suíte inteira em todos os projetos,
        # e os testes do painel do gestor (desktop) falham no mobile-chrome.
        run: npm run test:visual:update:all
        env:
          # Mesmas envs dos steps de mapa/e2e. Sem E2E_* o projeto `setup` é pulado
          # (e2e/auth.setup.ts) e os testes autenticados falham sem storageState;
          # sem VISUAL_REGRESSION os specs visuais fazem skip e nada é gerado.
          # Com elas, exit != 0 passa a ser teste quebrado, que é o que o `|| true`
          # escondia. (Sem secrets o step fica vermelho: falha honesta.)
          VISUAL_REGRESSION: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_MOTORISTA_EMAIL: ${{ secrets.E2E_MOTORISTA_EMAIL }}
          E2E_MOTORISTA_PASSWORD: ${{ secrets.E2E_MOTORISTA_PASSWORD }}
          E2E_GESTOR_EMAIL: ${{ secrets.E2E_GESTOR_EMAIL }}
          E2E_GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}

      - name: Upload updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updated-snapshots
          path: |
            e2e/**/*-snapshots/**/*.png
          retention-days: 30

      - name: Upload visual regression screenshots
        # SÓ PNG, de propósito. O repositório é público e o artefato é baixável
        # por qualquer conta logada no GitHub. O relatório HTML e o trace
        # guardam o texto dos `fill` (a senha das contas E2E no login) e os
        # cabeçalhos de rede com o token; `error-context.md` guarda o
        # instantâneo da página. A captura de tela só mostra o que a tela
        # mostrava (a senha aparece mascarada).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Resultado do e2e autenticado (portão do check obrigatório)
        # `Visual Regression (22.x)` é o check exigido pela main; o e2e vive no
        # job `e2e-auth`. Falha aqui se ele falhou. Se foi pulado (bot, fork ou
        # update_snapshots), o pulo já aparece como "Skipped" na lista de
        # checks; o aviso abaixo repete no resumo deste job.
        if: ${{ always() }}
        env:
          E2E_RESULT: ${{ needs.e2e-auth.result }}
        run: |
          case "$E2E_RESULT" in
            success) echo '### :white_check_mark: e2e autenticado passou' >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo '### :warning: e2e autenticado PULADO (bot, fork ou update_snapshots): o mapa e a suíte não rodaram' >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error title=e2e autenticado::resultado do job e2e-auth: $E2E_RESULT"
              exit 1
              ;;
          esac
