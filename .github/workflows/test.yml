name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run visual regression tests'
        required: false
        default: false
        type: boolean
      update_snapshots:
        description: 'Update visual regression snapshots'
        required: false
        default: false
        type: boolean

jobs:
  design-system-audit:
    name: Design System Drift Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build tokens
        run: npm run build:tokens

      - name: Generate hex report
        run: npm run report:hex

      - name: Verify hex allowlist
        run: npm run verify:design-system

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Design system outputs are out of date."
            git status --porcelain
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test -- --coverage --maxWorkers=2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage
            jest-results.json
          retention-days: 30

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Copiar worker do MapLibre
        # `npm ci --ignore-scripts` pula o postinstall, que é quem roda este
        # script — e o job não executa `build:web`, o outro lugar que o chama.
        # Sem isto, public/maplibre-gl-worker.mjs não existe em CI e o mapa web
        # trava em "Carregando mapa...", exatamente o modo de falha descrito no
        # CLAUDE.md. Passou despercebido até 25/08/2026 porque o teste de mapa
        # era um screenshot que mascarava justamente o mapa.
        run: node tools/scripts/copy-maplibre-worker.cjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run visual regression tests (public only - no auth required)
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npm run test:visual:public
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Testes de mapa (autenticados)
        # Os testes de mapa vivem no describe `@auth`, que o step acima NÃO roda:
        # `test:visual:public` filtra por `@visual.*@public`. Sem este step o mapa
        # fica sem cobertura nenhuma em CI — foi assim que duas baselines
        # congelando o mapa travado em "Carregando mapa..." sobreviveram desde
        # 09/01/2026 sem ninguém notar.
        #
        # Depende de conta de teste. Sem os secrets configurados, o step avisa e
        # sai sem falhar, em vez de quebrar o job de quem não os tem.
        #
        # ATENÇÃO: `Visual Regression` não está entre os checks exigidos pela
        # proteção da main, então uma falha aqui NÃO bloqueia merge — aparece
        # como job vermelho e anotação. Para bloquear, inclua este job em
        # required_status_checks.
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: |
          if [ -z "$E2E_MOTORISTA_EMAIL" ] || [ -z "$E2E_GESTOR_EMAIL" ]; then
            echo "::warning title=Mapa sem cobertura::Secrets E2E_* ausentes; os testes de mapa não rodaram. Configure E2E_MOTORISTA_EMAIL, E2E_MOTORISTA_PASSWORD, E2E_GESTOR_EMAIL e E2E_GESTOR_PASSWORD em Settings > Secrets."
            echo '### :warning: Testes de mapa não executados (secrets E2E ausentes)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx playwright test e2e/visual-critical.e2e.ts --project=chromium -g "mapa"
          echo '### :white_check_mark: Testes de mapa executados' >> "$GITHUB_STEP_SUMMARY"
        env:
          VISUAL_REGRESSION: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_MOTORISTA_EMAIL: ${{ secrets.E2E_MOTORISTA_EMAIL }}
          E2E_MOTORISTA_PASSWORD: ${{ secrets.E2E_MOTORISTA_PASSWORD }}
          E2E_GESTOR_EMAIL: ${{ secrets.E2E_GESTOR_EMAIL }}
          E2E_GESTOR_PASSWORD: ${{ secrets.E2E_GESTOR_PASSWORD }}

      - name: Update visual regression snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: npx playwright test --update-snapshots || true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload updated snapshots
        if: ${{ github.event.inputs.update_snapshots == 'true' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots
          path: |
            e2e/**/*-snapshots/**/*.png
          retention-days: 30

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e-report
            test-results
          retention-days: 7
