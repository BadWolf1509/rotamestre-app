name: Route Reminders and Expiration

# ATENÇÃO: o cron do GitHub Actions é best-effort. Em 27/08/2026 o evento das
# 01:00 UTC foi entregue às 10:43 UTC (+9h43) e a expiração apagou rotas criadas
# naquela manhã. O horário abaixo é, portanto, uma INTENÇÃO, não uma garantia.
#
# A proteção real mora na função SQL `expire_old_pending_routes` (migration
# 20260827190000): ela só expira rotas do dia corrente depois das 22:00
# America/Sao_Paulo. Se este job chegar atrasado, ele limpa dias anteriores e
# não toca no dia corrente. NÃO remova aquela guarda contando com a pontualidade
# daqui.
#
# O corpo da resposta das funções NÃO vai ao log: o repositório é público e o
# log de Actions é legível por qualquer pessoa. Os jobs imprimem só contadores
# (jq) e, em erro, o HTTP e o campo `error`. Sucesso = HTTP 200 E success == true.

on:
  schedule:
    # Lembrete às 16:00 Brasília (19:00 UTC) - Segunda a Sexta
    - cron: '0 19 * * 1-5'
    # Aviso FINAL às 20:00 Brasília (23:00 UTC) - Segunda a Sexta - 2h antes da expiração
    - cron: '0 23 * * 1-5'
    # Expiração às 22:00 Brasília (01:00 UTC do dia seguinte) - Segunda a Sexta
    # Segunda 22:00 BRT = Terça 01:00 UTC, então 2-6 (Terça a Sábado)
    - cron: '0 1 * * 2-6'
  workflow_dispatch: # Permite execução manual
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'remind'
        type: choice
        options:
          - remind
          - final-warning
          - expire

# Dois disparos do mesmo tipo (agendado + manual) não rodam ao mesmo tempo:
# o segundo espera, sem cancelar o que já está avisando/expirando.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event.inputs.action }}
  cancel-in-progress: false

# GITHUB_TOKEN só leitura por padrão. A única exceção é o job `avisar-falha`,
# que declara `issues: write` por conta própria (abre/comenta/fecha a issue).
permissions:
  contents: read

jobs:
  # Job para lembrete das 16:00 (19:00 UTC)
  remind-routes:
    name: Remind Pending Routes (16:00 BRT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 19 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'remind')

    steps:
      - name: Checkout (só os scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Chamar a Edge Function remind-routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          scripts/chamar-edge.sh remind-routes '{routes_found, reminders_sent}'

  # Job para aviso FINAL às 20:00 (23:00 UTC) - 2h antes da expiração
  final-warning-routes:
    name: Final Warning - Routes Expiring Soon (20:00 BRT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'final-warning')

    steps:
      - name: Checkout (só os scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Chamar a Edge Function remind-routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          scripts/chamar-edge.sh remind-routes '{routes_found, reminders_sent}' '{"urgency": "final"}'

  # Job para expiração das 22:00 (01:00 UTC)
  expire-routes:
    name: Expire Pending Routes (22:00 BRT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.schedule == '0 1 * * 2-6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'expire')

    steps:
      - name: Checkout (só os scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Chamar a Edge Function expire-routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          scripts/chamar-edge.sh expire-routes '{expired_count, notifications_sent, localizacoes_apagadas}'

  # Cron que falha em silêncio é lembrete/expiração que não aconteceu: o job
  # vermelho fica numa aba que ninguém abre. Este passo transforma a falha em
  # issue (label `agendador-falhou`), comenta nas repetições e fecha quando o
  # job volta a passar. Roda sempre; só um dos três jobs acima executa por
  # disparo, os outros chegam como `skipped`. O texto da issue leva só nome do
  # job, link da execução e horário (repositório público).
  avisar-falha:
    name: Avisar falha do agendador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [remind-routes, final-warning-routes, expire-routes]
    if: always()
    # Sobrescreve o topo: o job precisa ler o repositório (checkout) e escrever issues.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (só os scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Abrir, comentar ou fechar a issue do agendador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/lib/avisar-falha-agendada.js \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Remind Pending Routes (16:00 BRT)=${{ needs.remind-routes.result }}" \
            "Final Warning - Routes Expiring Soon (20:00 BRT)=${{ needs.final-warning-routes.result }}" \
            "Expire Pending Routes (22:00 BRT)=${{ needs.expire-routes.result }}"
