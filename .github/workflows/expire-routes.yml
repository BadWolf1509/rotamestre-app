name: Expire Pending Routes

on:
  schedule:
    # Rodar às 07:00 horário de Brasília (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  expire-routes:
    name: Expire Old Pending Routes
    runs-on: ubuntu-latest

    steps:
      - name: Call Edge Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://xezslsyxjivunmhhyxtd.supabase.co/functions/v1/expire-routes" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Error: Edge Function returned $http_code"
            exit 1
          fi

          echo "✅ Edge Function executed successfully"
