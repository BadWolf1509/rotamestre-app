name: Route Reminders and Expiration

# ATENÇÃO: o cron do GitHub Actions é best-effort. Em 27/08/2026 o evento das
# 01:00 UTC foi entregue às 10:43 UTC (+9h43) e a expiração apagou rotas criadas
# naquela manhã. O horário abaixo é, portanto, uma INTENÇÃO, não uma garantia.
#
# A proteção real mora na função SQL `expire_old_pending_routes` (migration
# 20260827190000): ela só expira rotas do dia corrente depois das 22:00
# America/Sao_Paulo. Se este job chegar atrasado, ele limpa dias anteriores e
# não toca no dia corrente. NÃO remova aquela guarda contando com a pontualidade
# daqui.
#
# O corpo da resposta das funções NÃO vai ao log: o repositório é público e o
# log de Actions é legível por qualquer pessoa. Os jobs imprimem só contadores
# (jq) e, em erro, o HTTP e o campo `error`. Sucesso = HTTP 200 E success == true.

on:
  schedule:
    # Lembrete às 16:00 Brasília (19:00 UTC) - Segunda a Sexta
    - cron: '0 19 * * 1-5'
    # Aviso FINAL às 20:00 Brasília (23:00 UTC) - Segunda a Sexta - 2h antes da expiração
    - cron: '0 23 * * 1-5'
    # Expiração às 22:00 Brasília (01:00 UTC do dia seguinte) - Segunda a Sexta
    # Segunda 22:00 BRT = Terça 01:00 UTC, então 2-6 (Terça a Sábado)
    - cron: '0 1 * * 2-6'
  workflow_dispatch: # Permite execução manual
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'remind'
        type: choice
        options:
          - remind
          - final-warning
          - expire

# Dois disparos do mesmo tipo (agendado + manual) não rodam ao mesmo tempo:
# o segundo espera, sem cancelar o que já está avisando/expirando.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event.inputs.action }}
  cancel-in-progress: false

# GITHUB_TOKEN só leitura: nenhum job aqui escreve no repositório.
permissions:
  contents: read

jobs:
  # Job para lembrete das 16:00 (19:00 UTC)
  remind-routes:
    name: Remind Pending Routes (16:00 BRT)
    runs-on: ubuntu-latest
    # Só executa às 19:00 UTC OU se for dispatch manual com action=remind
    if: github.event.schedule == '0 19 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'remind')

    steps:
      - name: Call Remind Edge Function
        run: |
          echo "🕐 Sending route reminders at 16:00 BRT..."

          http_code=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            "https://xezslsyxjivunmhhyxtd.supabase.co/functions/v1/remind-routes" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json") || http_code="000"

          # Falha se o HTTP não for 200 OU se o corpo não trouxer success == true.
          # O corpo inteiro não vai ao log (repositório público): só contadores.
          if [ "$http_code" != "200" ] || ! jq -e '.success == true' resposta.json > /dev/null 2>&1; then
            echo "❌ Error: Edge Function returned HTTP $http_code"
            jq -r '.error // "sem campo error"' resposta.json 2>/dev/null || echo "sem campo error"
            exit 1
          fi

          jq -c '{routes_found, reminders_sent}' resposta.json
          echo "✅ Reminders sent successfully"

  # Job para aviso FINAL às 20:00 (23:00 UTC) - 2h antes da expiração
  final-warning-routes:
    name: Final Warning - Routes Expiring Soon (20:00 BRT)
    runs-on: ubuntu-latest
    # Só executa às 23:00 UTC OU se for dispatch manual com action=final-warning
    if: github.event.schedule == '0 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'final-warning')

    steps:
      - name: Call Final Warning Edge Function
        run: |
          echo "⚠️ Sending FINAL warning - routes expire in 2 hours (20:00 BRT)..."

          http_code=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            "https://xezslsyxjivunmhhyxtd.supabase.co/functions/v1/remind-routes" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"urgency": "final"}') || http_code="000"

          # Falha se o HTTP não for 200 OU se o corpo não trouxer success == true.
          # O corpo inteiro não vai ao log (repositório público): só contadores.
          if [ "$http_code" != "200" ] || ! jq -e '.success == true' resposta.json > /dev/null 2>&1; then
            echo "❌ Error: Edge Function returned HTTP $http_code"
            jq -r '.error // "sem campo error"' resposta.json 2>/dev/null || echo "sem campo error"
            exit 1
          fi

          jq -c '{routes_found, reminders_sent}' resposta.json
          echo "✅ Final warnings sent successfully"

  # Job para expiração das 22:00 (01:00 UTC)
  expire-routes:
    name: Expire Pending Routes (22:00 BRT)
    runs-on: ubuntu-latest
    # Só executa às 01:00 UTC OU se for dispatch manual com action=expire
    if: github.event.schedule == '0 1 * * 2-6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'expire')

    steps:
      - name: Call Expire Edge Function
        run: |
          echo "🕙 Expiring pending routes at 22:00 BRT..."

          http_code=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            "https://xezslsyxjivunmhhyxtd.supabase.co/functions/v1/expire-routes" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json") || http_code="000"

          # Falha se o HTTP não for 200 OU se o corpo não trouxer success == true.
          # O corpo inteiro não vai ao log (repositório público): só contadores.
          if [ "$http_code" != "200" ] || ! jq -e '.success == true' resposta.json > /dev/null 2>&1; then
            echo "❌ Error: Edge Function returned HTTP $http_code"
            jq -r '.error // "sem campo error"' resposta.json 2>/dev/null || echo "sem campo error"
            exit 1
          fi

          jq -c '{expired_count, notifications_sent, localizacoes_apagadas}' resposta.json
          echo "✅ Routes expired successfully"
