name: Preparar Playwright para o app web
description: >-
  Worker do MapLibre, navegadores do Playwright (com cache) e libs de sistema
  do Chromium. Usada pelos jobs `e2e-auth` e `visual-regression` de test.yml,
  que antes repetiam estes passos linha por linha. Pressupõe checkout, Node e
  `npm ci --ignore-scripts` + patch-package já feitos pelo job.

runs:
  using: composite
  steps:
    - name: Copiar worker do MapLibre
      # `npm ci --ignore-scripts` pula o postinstall, que é quem roda este
      # script. Sem isto, public/maplibre-gl-worker.mjs não existe em CI e o
      # mapa web trava em "Carregando mapa...", exatamente o modo de falha
      # descrito no CLAUDE.md. Passou despercebido até 25/08/2026 porque o
      # teste de mapa era um screenshot que mascarava justamente o mapa.
      #
      # REDUNDANTE DESDE 07/09/2026, e fica de propósito: o `build:web` do job
      # começa chamando este mesmo script, então há duas garantias. Custa
      # ~0,3 s.
      shell: bash
      run: node tools/scripts/copy-maplibre-worker.cjs

    - name: Versão do Playwright (chave do cache)
      id: pw
      shell: bash
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "imagem=${ImageVersion:-sem-versao}" >> "$GITHUB_OUTPUT"

    - name: Cache dos navegadores do Playwright
      # O download dos navegadores é a maior parte do `playwright install`
      # (centenas de MB de Chromium). A chave é a VERSÃO do @playwright/test,
      # não o hash do lockfile: assim o cache sobrevive a bump de qualquer
      # outra dependência, e invalida exatamente quando precisa.
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

    - name: Cache dos pacotes apt do Playwright
      # O espelho apt da Azure já entregou 45 kB/s (26/10/2026): as ~26 MB de
      # libs do Chromium levavam quase 10 min e o passo estourava o prazo. Com
      # os .deb guardados, o apt só baixa o que mudou. A chave leva a imagem do
      # runner: imagem nova, pacotes novos, cache novo.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-playwright
        key: ${{ runner.os }}-apt-playwright-${{ steps.pw.outputs.version }}-${{ steps.pw.outputs.imagem }}

    - name: Devolver os .deb guardados ao apt
      shell: bash
      run: |
        # O apt-get descarta o .deb depois de instalar se houver docker-clean.
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-manter-deb > /dev/null
        if compgen -G "$HOME/apt-playwright/*.deb" > /dev/null; then
          sudo cp "$HOME"/apt-playwright/*.deb /var/cache/apt/archives/
        fi

    - name: Install Playwright browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      # Só o Chromium: é o único navegador dos projetos do playwright.config.ts.
      # Prazo pelo `timeout`: passo de composite action não aceita
      # `timeout-minutes` (o runner rejeita a chave).
      shell: bash
      run: timeout 15m npx playwright install --with-deps chromium

    - name: Dependências de sistema do Playwright
      # Com cache hit os navegadores já estão em ~/.cache/ms-playwright, mas
      # as libs de sistema (apt) NÃO são cacheadas pelo path — elas vivem fora
      # dele. Sem este step o Chromium cacheado não sobe, e o modo de falha é
      # ruim: todos os testes falham no launch, não no download.
      if: steps.pw-cache.outputs.cache-hit == 'true'
      # Só as libs do Chromium (sem ffmpeg/gstreamer de outros navegadores), e
      # prazo próprio: com o espelho apt lento, o passo pendurava até o timeout
      # do job (26/10/2026, três vezes no mesmo dia).
      shell: bash
      run: timeout 10m npx playwright install-deps chromium

    - name: Guardar os .deb para o próximo job
      shell: bash
      run: |
        mkdir -p "$HOME/apt-playwright"
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
          cp /var/cache/apt/archives/*.deb "$HOME/apt-playwright/"
        fi
