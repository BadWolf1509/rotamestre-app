version: 2
updates:
  # Dependências npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "BadWolf1509"
    assignees:
      - "BadWolf1509"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    # Ignorar majors que exigem migração manual coordenada
    ignore:
      # v11 é uma reescrita da API (74 JSX + 29 props). Bug upstream aberto em release
      # Android com drawer+map (maplibre/maplibre-react-native#1455). Revisitar quando
      # houver v11.1+ com fix e janela de QA em device.
      - dependency-name: "@maplibre/maplibre-react-native"
        update-types: ["version-update:semver-major"]
      # TS 6.0 quebra resolução de @types ambient (node, jest, google.maps) com a config
      # atual (expo/tsconfig.base + customConditions:[react-native] + moduleResolution:bundler).
      # 51+ erros de tipo surgem mesmo com baseUrl + ignoreDeprecations:"6.0". Revisitar
      # quando houver sprint dedicada para auditoria + alinhamento com expo/jest-expo.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Agrupar atualizações menores
    groups:
      # React e react-test-renderer devem subir juntos (jest-expo valida versão exata).
      # Listado antes dos grupos dev/prod para ter precedência.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
          - "react-test-renderer"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    reviewers:
      - "BadWolf1509"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
