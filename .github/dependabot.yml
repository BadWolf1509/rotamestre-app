version: 2
updates:
  # Dependências npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "BadWolf1509"
    assignees:
      - "BadWolf1509"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    # Agrupar atualizações menores
    groups:
      # React e react-test-renderer devem subir juntos (jest-expo valida versão exata).
      # Listado antes dos grupos dev/prod para ter precedência.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
          - "react-test-renderer"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    reviewers:
      - "BadWolf1509"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
