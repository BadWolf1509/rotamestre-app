version: 2
updates:
  # Dependências npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "BadWolf1509"
    assignees:
      - "BadWolf1509"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    # Ignorar majors que exigem migração manual coordenada
    ignore:
      # Modulo NATIVO: o CI web nao executa uma linha dele, entao QUALQUER bump passa
      # verde e so se manifestaria no build EAS ou no aparelho. Sobe sob janela de QA
      # em device, nunca pelo Dependabot — mesma regra ja aplicada aos
      # @react-native-community/* mais abaixo, e pelo mesmo motivo.
      #
      # O MAJOR tem razao adicional: v11 e uma reescrita da API (74 JSX + 29 props), e
      # ha bug upstream aberto em release Android com drawer+map
      # (maplibre/maplibre-react-native#1455). Revisitar quando houver v11.1+ com fix.
      #
      # O PATCH entrou aqui em 17/09/2026, e a razao importa: o 11.3.8 -> 11.3.10 do
      # PR #525 foi validado em aparelho real (moto g15, Android 15) — mapa, drawer,
      # rotacao, background/foreground e gestos, todos identicos a baseline. O bump
      # estava BOM. O que nao se sustenta e o PROCESSO: aquela validacao custou dois
      # builds EAS e um aparelho a mao, e nao e o que acontece toda segunda-feira. Sem
      # ela, o verde do CI nao diz nada sobre a metade nativa.
      #
      # Isto NAO silencia vulnerabilidade: `scripts/audit-producao.js` roda
      # `npm audit --omit=dev` como step BLOQUEANTE e pega advisory novo neste pacote
      # independentemente do Dependabot.
      - dependency-name: "@maplibre/maplibre-react-native"
      # TS 6.0 quebra resolução de @types ambient (node, jest, google.maps) com a config
      # atual (expo/tsconfig.base + customConditions:[react-native] + moduleResolution:bundler).
      # 51+ erros de tipo surgem mesmo com baseUrl + ignoreDeprecations:"6.0". Revisitar
      # quando houver sprint dedicada para auditoria + alinhamento com expo/jest-expo.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Pacotes gerenciados pelo Expo SDK: as versões são fixadas por `expo install`
      # e devem subir SÓ no upgrade de SDK (coordenado), não isoladamente pelo
      # Dependabot — que gera PRs fora de sincronia com o SDK. Ex.: react-native-worklets
      # 0.9.2 vs SDK 56 que fixa 0.8.3 (acoplado por ABI ao reanimated).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react-native"
      # @react-native/* são publicados do mesmo monorepo do react-native e precisam
      # acompanhar a versão dele, que o SDK fixa (RN 0.85.3 no SDK 56). O bump isolado
      # de @react-native/jest-preset para 0.87.0 (PR #409) quebrou as 334 suítes: o
      # preset mocka react-native/setup-env, ausente na 0.85.3. Sobem só no SDK.
      - dependency-name: "@react-native/*"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-web"
      - dependency-name: "@react-native-async-storage/async-storage"
      # @react-native-community/* também é fixado pelo SDK em bundledNativeModules
      # (slider 5.2.0, datetimepicker 9.1.0, netinfo 12.0.1 — todos travados sem
      # caret no package.json por expo install). São módulos nativos: o CI web não
      # executa uma linha deles, então o bump passa verde e só quebra no build EAS.
      - dependency-name: "@react-native-community/*"
      # React é fixado pelo SDK em 19.2.3 (jest-expo valida a versão exata) e sobe
      # só via expo install. Bumps isolados quebram os testes (react-test-renderer).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-is"
      - dependency-name: "react-test-renderer"
      # @shopify/flash-list é fixado pelo SDK (bundledNativeModules: 2.0.2).
      - dependency-name: "@shopify/flash-list"
      # testing-library v14 é major com migração (render/fireEvent assíncronos) —
      # ignorar só o major; minors/patches continuam vindo.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      # jest-environment-jsdom major (30.x) nao sobe sozinho. O jsdom 27 que ele
      # embute define `window` como non-configurable, e o
      # `@react-native/jest-preset` — fixado pelo SDK, nao por nos — roda
      # `Object.defineProperties(global, { window: ... })` em TODA suite. As duas
      # suites com `@jest-environment jsdom` morrem no setup com
      # "TypeError: Cannot redefine property: window" (PR #517). Alem disso o
      # `jest` core aqui e 29.x: um environment v30 sob runner v29 nao e
      # combinacao suportada. Sobe junto com o upgrade de SDK, como o preset.
      - dependency-name: "jest-environment-jsdom"
        update-types: ["version-update:semver-major"]
    # Agrupar atualizações menores
    #
    # ORDEM IMPORTA: "if a dependency matches more than one rule, it's included
    # in the first group that it matches". O grupo `sentry` precisa vir ANTES de
    # `production-dependencies`, senao os patches do Sentry caem naquele e o
    # agrupamento aqui nunca acontece.
    groups:
      # Os pacotes do Sentry sobem JUNTOS ou nao sobem.
      #
      # POR QUE. `@sentry/react` fixa `@sentry/browser` em versao EXATA. Subir um
      # sem o outro faz o npm aninhar uma segunda arvore inteira do Sentry sob
      # `@sentry/react/node_modules/` (browser, browser-utils, feedback, replay,
      # replay-canvas e tres copias de core) — dois SDKs no bundle. Medido em
      # 14/09/2026: o PR #521 (so `@sentry/browser`) levou o bundle de 3,37 MB
      # para 3,88 MB gzipped, estourando o limite de 3,5 MB do `.size-limit.json`,
      # enquanto o #522 (so `@sentry/react`) passou em 3,37 MB.
      #
      # `production-dependencies` cobre so `patch`, entao os minors do Sentry
      # (10.73 -> 10.74) escapavam do agrupamento e viravam PRs separados — que e
      # exatamente o que dessincroniza a arvore. Daqui em diante minor tambem
      # entra, e os dois viajam no mesmo PR.
      sentry:
        patterns:
          - "@sentry/*"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    reviewers:
      - "BadWolf1509"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
